description:
  en:
    localisedName: jeap-project-rag-preindexed
    shortDescription: Docker image bundling the jeap-project-rag MCP server with a pre-built index of the jEAP codebase
    longDescription: >
      jeap-project-rag-preindexed builds the `ghcr.io/jeap-admin-ch/jeap-project-rag-preindexed` Docker image: the upstream
      jeap-project-rag MCP server bundled with a pre-populated LanceDB index of a curated set of JEAP library
      source code and JME example repositories. There is no application code in this repository - it is a thin
      shell/Docker harness around the upstream jeap-project-rag binary, so consumers of the image get instant
      semantic search over the jEAP codebase without having to clone and index the repos themselves.
    features:
      - Builds a Docker image pre-loaded with a jEAP codebase index
      - Regularly re-indexes the jEAP codebase for the jEAP MCP server
