name: Build and publish preindexed image

on:
  push:
    branches: [ "main" ]
  # Without this, PR branches (e.g. Dependabot's github-actions bumps) never get a CI run at
  # all - see the "push" gate below on the build step, which is what actually keeps a
  # PR-triggered run from publishing an image.
  pull_request:
    branches: [ "main" ]
  schedule:
    # Re-index twice a week (Monday and Wednesday mornings). Replaces the Jenkinsfile's cron
    # plus its upstream-on-jeap-spring-boot-parent-success trigger - that upstream trigger has
    # no GitHub-side equivalent (the mirror has no build workflow of its own to hook), so this
    # is intentionally schedule-only.
    - cron: '0 3 * * 1,3'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tag shape kept from this repo's old Jenkins-based build, so anything pinning a specific
      # tag keeps working either way it got built: <baseTag>-al2023-<UTC timestamp>.
      - name: Compute image tag
        id: tag
        run: |
          set -euo pipefail
          base_tag="0.1.0-al2023"
          timestamp=$(date -u +%Y%m%d%H%M%S)
          echo "tag=${base_tag}-${timestamp}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # jeap-project-rag has no "latest" tag yet (that only gets pushed from its own main
      # branch, which hasn't happened yet), so the Dockerfile's default ARG resolves to
      # nothing. Rather than pinning a fixed snapshot here (which would go stale, and
      # eventually 404 once jeap-project-rag's own cleanup job prunes it), resolve whatever
      # upstream actually has each time this runs: prefer "latest" once it exists, otherwise
      # fall back to the most recent versioned tag (sorts correctly - the timestamp suffix is
      # a fixed-width YYYYMMDDHHMMSS).
      - name: Resolve upstream jeap-project-rag tag
        id: upstream
        run: |
          set -euo pipefail
          token=$(curl -sf "https://ghcr.io/token?service=ghcr.io&scope=repository:jeap-admin-ch/jeap-project-rag:pull" | jq -r .token)
          tags=$(curl -sf -H "Authorization: Bearer ${token}" "https://ghcr.io/v2/jeap-admin-ch/jeap-project-rag/tags/list" | jq -r '.tags[]')
          if echo "${tags}" | grep -qx latest; then
            tag=latest
          else
            tag=$(echo "${tags}" | sort | tail -n1)
          fi
          echo "Resolved jeap-project-rag tag: ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # No Maven/Cargo build here - this repo has no application code. The RUN jeap-index-all.sh
      # step inside the Dockerfile does the actual work (cloning + indexing from GitHub).
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          # Build-only on a PR (e.g. Dependabot) - never push from an unmerged, unreviewed change.
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            JEAP_PROJECT_RAG_TAG=${{ steps.upstream.outputs.tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  notify-ms-teams:
    needs: build-and-push-image
    # Only for main - a failing PR run is already visible in its own checks, and the scheduled
    # re-index run's ref is also "main", so this still fires for that trigger too.
    if: always() && github.ref == 'refs/heads/main' && needs.build-and-push-image.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Microsoft Teams of build failure
        env:
          MS_TEAMS_WEBHOOK: ${{ secrets.MS_TEAMS_WEBHOOK }}
        run: |
          if [ -z "$MS_TEAMS_WEBHOOK" ]; then
            echo "MS_TEAMS_WEBHOOK is not configured"
            exit 0
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          jq -n \
            --arg workflow "${{ github.workflow }}" \
            --arg project "${{ github.repository }}" \
            --arg repository "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "${{ github.sha }}" \
            --arg actor "${{ github.actor }}" \
            --arg runId "${{ github.run_id }}" \
            --arg runUrl "$RUN_URL" \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [
                      {
                        type: "TextBlock",
                        text: "GitHub Actions",
                        weight: "Bolder",
                        size: "Medium"
                      },
                      {
                        type: "TextBlock",
                        text: ($workflow + " • " + $project),
                        weight: "Bolder",
                        size: "Large",
                        wrap: true
                      },
                      {
                        type: "FactSet",
                        facts: [
                          { title: "Status", value: "🔴 Failed" },
                          { title: "Repository", value: $repository },
                          { title: "Branch", value: $branch },
                          { title: "Commit", value: ($commit[0:7]) },
                          { title: "Triggered by", value: $actor },
                          { title: "Run", value: ("#" + $runId) }
                        ]
                      }
                    ],
                    actions: [
                      { type: "Action.OpenUrl", title: "View GitHub Actions run", url: $runUrl }
                    ]
                  }
                }
              ]
            }' |
            http_code=$(curl --silent --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              -H "Content-Type: application/json" \
              --data-binary @- \
              "$MS_TEAMS_WEBHOOK" 2>/dev/null)
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "Teams notification failed (HTTP status: $http_code)"
              exit 1
            fi
